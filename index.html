<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
    <title>Nimbus - Seu espaço digital</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/mobile_cascata.css">
    <link rel="icon" href="Imagens/Logo.png">
</head>

<body>
    <header class="header-body" id="header-body">
        <div class="logo">
            <img src="Imagens/LogoHeader.png" alt="Frutiger Aero Logo">
            <h1>Nimbus</h1>
        </div>
        <nav class="nav-btn" id="nav-btn">
            <button class="btn-menu" id="btn-menu" title="Ir para o menu">Menu</button>
            <button class="btn-mensagens" id="btn-mensagens" title="Ir para as conversas">Mensagens</button>
        </nav>
        <div class="container-view" id="container-view">
            <button class="view" id="view" title="Visualizar"><img src="SVGs/eye-svgrepo-com.svg"></button>
        </div>
    </header>
    <main>
        <div class="overlay-widget" id="overlay-widget"></div>
        <aside class="sidebar-esquerda">
            <div class="container-widget" id="container-widget">
                <header class="header-widget" id="header-widget">
                    <button class="btn-fechar" id="btn-fechar" title="Fechar"><img
                            src="Windows 7 Icons/262.png"></button>
                    <button class="btn-relogio" id="btn-relogio" title="Relógio"><img
                            src="Windows 7 Icons/370.png"></button>
                    <button class="btn-calendario" id="btn-calendario" title="Calendário"><img
                            src="Windows 7 Icons/398.png"></button>
                    <button class="btn-nota" id="btn-nota" title="Notas"><img src="Windows 7 Icons/092.png"></button>
                    <button class="btn-musica" id="btn-musica" title="Música"><img
                            src="Windows 7 Icons/517.png"></button>
                    <button class="open-sidebar" id="open-sidebar" title="Abrir barra lateral"><img
                            src="Windows 7 Icons/386.png"></button>
                </header>
                <div data-widget="relogio" data-widget="calendario" data-widget="nota" class="widget-visualizações"
                    id="widget-visualizações">
                    <div class="container-relogio" id="container-relogio">
                        <h2 id="horario" title="Horário atual">00:00:00</h2>
                        <span id="span-relogio">Pare de clicar em mim!</span>
                    </div>
                    <div class="container-calendario" id="container-calendario">
                        <h2 id="data" title="Data atual">00/00/0000</h2>
                    </div>
                    <div class="container-nota" id="container-nota">
                        <div id="notas">
                            <span id="sem-notas">Sem Notas</span>
                            <template id="TemplateNota">
                                <div class="container-notas">
                                    <h2></h2>
                                    <p class="nota-texto"></p>
                                    <div class="container-inferior">
                                        <div class="container-btns">
                                            <button class="btn-excluir">Excluir</button>
                                            <button class="btn-editar">Editar</button>
                                        </div>
                                        <div class="container-btnmais">
                                            <button class="btn-mais" id="btn-mais">Mais ⬇︎</button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div class="container-musica-widget" id="container-musica-widget">
                        <div class="container-musica-img">
                            <img src="Windows 7 Icons/517.png" class="musica-icone">
                        </div>
                        <div class="musica-btn-widget">
                            <button><img src="Windows 7 Icons/469.png"></button>
                            <button class="pause" id="pause"><img src="Windows 7 Icons/472.png"></button>
                            <button><img src="Windows 7 Icons/481.png"></button>
                        </div>
                    </div>
                </div>
                <div class="container-musica" id="container-musica">
                    <img src="Windows 7 Icons/517.png" class="musica-icone">
                    <div class="musica-btn">
                        <button><img src="Windows 7 Icons/469.png"></button>
                        <button class="pause" id="BtnPause"><img src="Windows 7 Icons/472.png"></button>
                        <button><img src="Windows 7 Icons/481.png"></button>
                    </div>
                </div>
        </aside>
        <article>
            <header id="header-main" class="header-main">
                <button class="contato-sair" id="ContatoSair"><img src="SVGs/chevron-left-svgrepo-com.svg"></button>
                <img id="foto-perfil-contato">
                <h3 id="nome-contato"></h3>
            </header>
            <div class="mensagens" id="mensagens">
                <div class="container-mensagem" id="container-mensagem"></div>
            </div>
            <div class="container-input">
                <textarea class="input" id="input" placeholder="Mensagem..."></textarea> <button class="enviar"
                    id="enviar" title="Enviar mensagem"><img src="Windows 7 Icons/012.png"></button>
            </div>
        </article>
        <aside class="sidebar-direita">
            <header class="header-menu">
                <button class="open-sidebar" id="OpenSidebar" title="Abrir barra lateral"><img
                        src="SVGs/menu-svgrepo-com - cópia.svg"></button>
                <button popovertarget="dropdown" class="add" id="add"><img
                        src="SVGs/plus-svgrepo-com - cópia.svg" title="Adicionar contato"></button>
                <div popover id="dropdown">
                    <button command="show-modal" commandFor="ModalContato" id="BtnAdicionarContato">Adicionar Contato</button>
                    <button command="show-modal" commandFor="ModalGrupo" id="BtnCriarGrupo">Criar Grupo</button>
                </div>
            </header>
            <div class="input-area-pesquisar">
                <input type="search" id="input-pesquisar" class="input-pesquisar" placeholder="Pesquisar Contato">
            </div>
            <template id="TemplateContato">
                <div class="contato">
                    <img id="FotoDePerfil">
                    <h4></h4>
                </div>
            </template>
            <div class="container-btn-sidebar-direita">
                <button command="show-modal" commandFor="ModalNota" class="nova-nota" id="nova-nota"
                    title="Criar nova nota">Nova Nota</button>
                <button command="show-modal" commandFor="ModalMensagemRapida" class="mensagem-rapida"
                    id="mensagem-rapida" title="Mensagem rápida">Mensagem Rápida</button>
            </div>
            <div class="chat-contatos" id="chat-contatos"></div>
        </aside>
        <div id="audios" class="audios">
            <audio id="windows-7" src="sons/windows-7-startup.mp3"></audio>
            <audio id="enchendo" src="sons/enchendo-.wav"></audio>
            <audio id="agua" src="sons/Agua.mp3"></audio>
            <audio id="bolhas" src="sons/bolhas.mp3"></audio>
            <audio id="golfinho" src="sons/golfinho.mp3"></audio>
            <audio id="windows-XP" src="sons/WindowsXP.mp3"></audio>
        </div>
    </main>
    <div class="container-golfinho"><img src="Imagens/golfinho.png" class="img-peixe"></div>
    <div class="agua-fish" id="agua-fish"></div>

    <dialog id="ModalNota">
        <div class="nav-bar-modal">
            <h2>Criar Nova Nota</h2>
            <button command="close" commandFor="ModalNota" class="btn-fechar-modal"><img
                    src="SVGs/close-SVG.svg"></button>
        </div>
        <form method="dialog" id="FormNota">
            <input type="text" id="input-titulo" placeholder="Digite o título (opicional)">
            <textarea id="input-nota" placeholder="Digite sua Nota" required></textarea>
        </form>
        <div class="conatiner-btn-actions">
            <button type="submit" form="FormNota" class="btn-confirmar" >Criar Nota</button>
            <button command="close" commandFor="ModalNota" class="btn-cancelar">Cancelar</button>
        </div>
    </dialog>

    <dialog id="ModalContato">
        <div class="nav-bar-modal">
            <h2>Criar Contato</h2>
            <button command="close" commandFor="ModalContato" class="btn-fechar-modal"><img
                    src="SVGs/close-SVG.svg"></button>
        </div>
        <form method="dialog" id="FormContato">
            <input type="tel" id="input-numero" placeholder="Número" required pattern="\(\d{2}\) \d{4,5}-\d{4}"
                title="Ex: (11) 12345-6789">
            <input type="text" id="input-nome" placeholder="nome">
        </form>
        <div class="conatiner-btn-actions">
            <button type="submit" form="FormContato" class="btn-confirmar" >Adicionar</button>
            <button command="close" commandFor="ModalContato" class="btn-cancelar">Cancelar</button>
        </div>
    </dialog>

    <dialog id="ModalMensagemRapida">
        <div class="nav-bar-modal">
            <h2>Mensagem Rápida</h2>
            <button command="close" commandFor="ModalMensagemRapida" class="btn-fechar-modal"><img
                    src="SVGs/close-SVG.svg"></button>
        </div>
        <template id="TemplateContatoRapido">
            <label class="contato-rapido">
                <input type="radio" name="contato-selecionado" form="FormMensagemRapida" required>
                <span></span>
            </label>
        </template>
        <form method="dialog" id="FormMensagemRapida">
            <input type="text" id="InputMensagemRapida" placeholder="Digite sua mensagem" required>
            <div class="lista-contatos" id="ContatosMensagemRapida"></div>
        </form>
        <div class="conatiner-btn-actions">
            <button type="submit" form="FormMensagemRapida" class="btn-confirmar" >Enviar</button>
            <button command="close" commandFor="ModalMensagemRapida" class="btn-cancelar"
            >Cancelar</button>
        </div>
    </dialog>

    <dialog id="ModalGrupo">
        <div class="nav-bar-modal">
            <h2>Criar Contato</h2>
            <button command="close" commandFor="ModalGrupo" class="btn-fechar-modal"><img
                    src="SVGs/close-SVG.svg"></button>
        </div>
        <template id="TemplateGrupo">
            <label class="contato-grupo">
                <input type="checkbox" name="membro-selecionado" form="FormGrupo">
                <span></span>
            </label>
        </template>
        <form method="dialog" id="FormGrupo">
            <input type="text" id="input-grupo" placeholder="Nome do Grupo" required>
            <div class="lista-contatos" id="ContatosGrupo"></div>
        </form>
        <div class="conatiner-btn-actions">
            <button type="submit" form="FormGrupo" class="btn-confirmar" >Criar Grupo</button>
            <button command="close" commandFor="ModalGrupo" class="btn-cancelar">Cancelar</button>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
